name: TreadExMine CI

on:
  push:
    branches:
      - "feature/**"
      - feature/project-setup
  pull_request:
    branches:
      - feature/project-setup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

    
      - name: Debug backend package
        working-directory: server
        run: |
          echo "Current directory:"
          pwd
          echo "Backend package scripts:"
          node -e "console.log(JSON.stringify(require('./package.json').scripts, null, 2))"
          echo "Backend package location:"
          ls -la package.json package-lock.json
          echo "Checked out commit:"
          git rev-parse --short HEAD

      - name: Run backend tests
        working-directory: server
        run: npm test



  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Run backend tests
        run: npm test
        working-directory: server
