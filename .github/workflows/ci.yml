name: TreadExMine CI Pipeline

on:
  push:
    branches:
      - 'development'
      - 'develop'
      - 'dev'
      - 'feature/**'
  pull_request:
    branches:
      - 'main'
      - 'feature/project-setup'
  workflow_dispatch:

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

  backend-ci:
    name: Backend CI (Tests & Verification)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: dev_jwt_secret_key_treadexmine_2026
          JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_treadexmine_2026
